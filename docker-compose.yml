services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: heatnet
      POSTGRES_USER: heatnet
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-heatnet}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatnet -d heatnet"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/heatnet
      DATABASE_USER: heatnet
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-heatnet}
      APP_STORAGE_ROOT: /data/jobs
      APP_UPLOAD_MAX_BYTES: 3000000000
      APP_CALCULATION_ROUTING_MODE: ${APP_CALCULATION_ROUTING_MODE:-visibility}
      APP_CALCULATION_ROUTE_SEARCH_PARALLELISM: ${APP_CALCULATION_ROUTE_SEARCH_PARALLELISM:-4}
      APP_CALCULATION_MAX_COMBINATIONS: ${APP_CALCULATION_MAX_COMBINATIONS:-64}
      APP_CALCULATION_MAX_VISIBILITY_VERTICES: ${APP_CALCULATION_MAX_VISIBILITY_VERTICES:-300}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    volumes:
      - job-files:/data/jobs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  job-files:
